name: Training reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-reminders
  cancel-in-progress: false

jobs:
  emit-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger protected reminder endpoint
        env:
          TRAINING_REMINDERS_CRON_SECRET: ${{ secrets.TRAINING_REMINDERS_CRON_SECRET }}
        run: |
          test -n "$TRAINING_REMINDERS_CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 45 \
            -H "Authorization: Bearer $TRAINING_REMINDERS_CRON_SECRET" \
            https://mwos-hub.com/api/training-reminders
